[package]
name = "safe_deposit"
version = "0.0.0"
edition = "2021"

[lib]
# Use rlib for `cargo test` on Windows (cdylib causes linker overflow).
# For WASM deployment builds, use: cargo build --target wasm32-unknown-unknown --release
crate-type = ["rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "22.0.10"

[dev-dependencies]
soroban-sdk = { version = "22.0.10", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true




