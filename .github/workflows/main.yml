name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-contracts:
    name: Build, Test & Deploy Soroban Contracts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Cargo Test
        working-directory: ./safe_deposit
        run: cargo test

      - name: Build WASM Contract
        working-directory: ./safe_deposit
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Setup Stellar CLI
        uses: stellar/actions/setup-cli@main
        with:
          version: latest

      - name: Deploy Contract to Testnet
        working-directory: ./safe_deposit
        run: |
          stellar keys generate deployer --network testnet --fund
          echo "================================================="
          echo "DEPLOYING SAFEDEPOSIT CONTRACT TO TESTNET..."
          CONTRACT_ID=$(stellar contract deploy --wasm target/wasm32-unknown-unknown/release/safe_deposit.wasm -s deployer --network testnet)
          echo "================================================="
          echo "🎉 SUCCESS! CONGRATULATIONS ON COMPLETING LEVEL 4"
          echo "YOUR NEW CONTRACT ID IS:"
          echo "$CONTRACT_ID"
          echo "================================================="
          echo "Copy the Contract ID above into your frontend/.env"

  build-frontend:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js project
        working-directory: ./frontend
        run: npm run build
