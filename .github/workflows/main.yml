name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-contracts:
    name: Build & Test Soroban Contracts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI (latest)
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v25.1.0/stellar-cli-25.1.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv stellar /usr/local/bin/stellar
          stellar --version

      - name: Run Cargo Tests
        working-directory: ./safe_deposit
        run: cargo test --features testutils

      - name: Build & Optimize WASM Contract
        working-directory: ./safe_deposit
        run: stellar contract build

      - name: Deploy Contract to Testnet
        working-directory: ./safe_deposit
        run: |
          stellar keys generate deployer --network testnet --fund
          echo "================================================="
          echo "DEPLOYING SAFEDEPOSIT CONTRACT TO TESTNET..."
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/safe_deposit.wasm \
            -s deployer \
            --network testnet)
          echo "================================================="
          echo "🎉 LEVEL 4 - YOUR NEW SAFEDEPOSIT CONTRACT ID IS:"
          echo "$CONTRACT_ID"
          echo "================================================="
        continue-on-error: true

  build-frontend:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Check
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Build Next.js project
        working-directory: ./frontend
        run: npm run build
