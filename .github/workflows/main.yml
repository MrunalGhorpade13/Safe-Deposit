name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-contracts:
    name: Build & Test Soroban Contracts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Cargo Test
        working-directory: ./safe_deposit
        run: cargo test --features testutils

      - name: Build WASM Contract
        working-directory: ./safe_deposit
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI & Deploy to Testnet
        working-directory: ./safe_deposit
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.7.0/stellar-cli-22.7.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./stellar keys generate deployer --network testnet --fund
          echo "Optimizing WASM binary..."
          ./stellar contract optimize --wasm target/wasm32-unknown-unknown/release/safe_deposit.wasm
          echo "================================================="
          echo "DEPLOYING SAFEDEPOSIT CONTRACT TO TESTNET..."
          CONTRACT_ID=$(./stellar contract deploy --wasm target/wasm32-unknown-unknown/release/safe_deposit.optimized.wasm -s deployer --network testnet)
          echo "================================================="
          echo "🎉 LEVEL 4 - YOUR NEW CONTRACT ID IS:"
          echo "$CONTRACT_ID"
          echo "================================================="
        continue-on-error: true

  build-frontend:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Check
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Build Next.js project
        working-directory: ./frontend
        run: npm run build
